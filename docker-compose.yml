services:
  postgres:
    image: postgres:16-alpine
    container_name: resilia-postgres
    environment:
      POSTGRES_USER: resilia
      POSTGRES_PASSWORD: resilia
      POSTGRES_DB: resilia
    ports:
      - "5432:5432"
    volumes:
      - resilia_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resilia -d resilia"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: resilia-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  resilia_pg:
